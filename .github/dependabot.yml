version: 2
updates:
  - package-ecosystem: maven
    directory: /backend/core-platform
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend/admin-portal
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-eslint/*", "angular-eslint"]
  - package-ecosystem: docker
    directories: ["/backend/core-platform", "/frontend/admin-portal"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

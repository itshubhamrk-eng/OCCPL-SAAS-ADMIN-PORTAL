name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which parts a change touches (infra/scripts/changed-paths.sh), so a frontend-only change does
  # not run the backend tests and vice versa. A skipped job counts as passed. Changes to the pipeline
  # itself run everything.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      infra: ${{ steps.paths.outputs.infra }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base "origin/$BASE_REF" HEAD || true)
          else
            base=$(git rev-parse --verify -q HEAD^1 || true) # the commit before this push
          fi
          infra/scripts/changed-paths.sh "$base" HEAD | tee -a "$GITHUB_OUTPUT"

  backend:
    name: Backend (Java 25, ${{ matrix.mysql }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Production runs Amazon RDS MySQL 8.4 LTS (D-14); 9.7 is the planned upgrade.
        mysql: ['mysql:8.4', 'mysql:9.7']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Unit + slice tests, Spring Modulith boundary verification, Testcontainers integration tests
      # (MySQL 9.7, Keycloak 26.8.1, Redis) and the Core ↔ sample product end-to-end test
      # (Docker is available on GitHub-hosted runners).
      - run: mvn -B -ntp verify -Doccpl.test.mysql-image=${{ matrix.mysql }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ strategy.job-index }}
          path: backend/**/target/*-reports/

  frontend:
    name: Frontend (Angular 22)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/admin-portal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/admin-portal/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npx ng lint
      - run: npm test
      - run: npx ng build --configuration production
      - run: npm audit --omit=dev --audit-level=high

  images:
    name: Container images
    needs: [changes, backend, frontend]
    # Skipped test jobs must not block it; a failed one must.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build core-platform image
        uses: docker/build-push-action@v7
        with:
          context: backend/core-platform
          push: false
          load: true
          tags: occpl/core-platform:${{ github.sha }}
      - name: Build product-sample image
        uses: docker/build-push-action@v7
        with:
          context: backend/product-sample
          push: false
          load: true
          tags: occpl/product-sample:${{ github.sha }}
      - name: Build admin-portal image
        uses: docker/build-push-action@v7
        with:
          context: frontend/admin-portal
          push: false
          load: true
          tags: occpl/admin-portal:${{ github.sha }}
      # Known vulnerabilities in the images (OS packages and bundled libraries). Fails on HIGH or
      # CRITICAL findings that have a fix. Trivy is the pinned release binary, verified against the
      # release's checksum file (building it from source needs a newer Go than the runner has).
      - name: Install Trivy
        run: |
          v=0.74.0
          base="https://github.com/aquasecurity/trivy/releases/download/v$v"
          curl -fsSL -o /tmp/trivy.tar.gz "$base/trivy_${v}_Linux-64bit.tar.gz"
          curl -fsSL -o /tmp/trivy_checksums.txt "$base/trivy_${v}_checksums.txt"
          (cd /tmp && grep " trivy_${v}_Linux-64bit.tar.gz\$" trivy_checksums.txt | sed "s# trivy_${v}_Linux-64bit.tar.gz# trivy.tar.gz#" | sha256sum -c -)
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy
          trivy --version
      - name: Scan images
        run: |
          for image in core-platform product-sample admin-portal; do
            trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
              --exit-code 1 "occpl/$image:${{ github.sha }}"
          done

  infra:
    name: Infrastructure (Terraform, deploy bundle)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
      - run: terraform fmt -check -recursive infra/aws
      - name: terraform validate
        run: |
          for stack in bootstrap shared dev envs/production; do
            terraform -chdir="infra/aws/$stack" init -backend=false -input=false >/dev/null
            terraform -chdir="infra/aws/$stack" validate
          done
      - name: Production realm is in sync with the development realm
        run: python3 infra/aws/compose/keycloak/make-production-realm.py --check
      - name: Shell scripts
        run: |
          for f in infra/aws/scripts/*.sh infra/aws/compose/bin/*.sh infra/scripts/*.sh infra/vps/bin/*.sh infra/vps/mysql/*.sh; do bash -n "$f"; done
          shellcheck infra/aws/scripts/*.sh infra/aws/compose/bin/*.sh infra/scripts/*.sh infra/vps/bin/*.sh infra/vps/mysql/*.sh
      - name: Deploy compose file (AWS)
        run: |
          # The env files exist only on a real instance (written by render-env.sh): empty stand-ins.
          sudo mkdir -p /etc/occpl && sudo touch /etc/occpl/core.env /etc/occpl/keycloak.env /etc/occpl/portal.env
          REGISTRY=r RELEASE=x OCCPL_ENV=ci AWS_REGION=ap-south-1 \
            docker compose -f infra/aws/compose/docker-compose.yml config --quiet
      - name: VPS compose file
        run: |
          cp infra/vps/.env.example /tmp/vps.env
          sed -i 's/^RELEASE=.*/RELEASE=0000000000000000000000000000000000000000/' /tmp/vps.env
          for v in MYSQL_ROOT_PASSWORD DB_MIGRATOR_PASSWORD DB_APP_PASSWORD DB_BACKUP_PASSWORD DB_KEYCLOAK_PASSWORD REDIS_PASSWORD KEYCLOAK_ADMIN_PASSWORD KEYCLOAK_ADMIN_CLIENT_SECRET PROVISIONING_CLIENT_SECRET SMTP_PASSWORD; do
            sed -i "s/^$v=.*/$v=x/" /tmp/vps.env
          done
          docker compose --project-directory infra/vps --env-file /tmp/vps.env -f infra/vps/docker-compose.yml config --quiet
      - name: Caddyfile
        run: |
          docker run --rm -v "$PWD/infra/vps/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e ACME_EMAIL=a@b.c -e ADMIN_HOST=admin.x.test -e API_HOST=api.x.test -e AUTH_HOST=auth.x.test -e COURIER_HOST=courier.x.test -e ADMIN_IPS=10.0.0.1/32 \
            caddy:2.10.2 caddy validate --config /etc/caddy/Caddyfile

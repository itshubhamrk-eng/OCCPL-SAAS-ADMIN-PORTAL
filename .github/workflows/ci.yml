name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 25, ${{ matrix.mysql }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Production runs Amazon RDS MySQL 8.4 LTS (D-14); 9.7 is the planned upgrade.
        mysql: ['mysql:8.4', 'mysql:9.7']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Unit + slice tests, Spring Modulith boundary verification, Testcontainers integration tests
      # (MySQL 9.7, Keycloak 26.8.1, Redis) and the Core ↔ sample product end-to-end test
      # (Docker is available on GitHub-hosted runners).
      - run: mvn -B -ntp verify -Doccpl.test.mysql-image=${{ matrix.mysql }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ strategy.job-index }}
          path: backend/**/target/*-reports/

  frontend:
    name: Frontend (Angular 22)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/admin-portal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/admin-portal/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npx ng lint
      - run: npm test
      - run: npx ng build --configuration production
      - run: npm audit --omit=dev --audit-level=high

  images:
    name: Container images
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build core-platform image
        uses: docker/build-push-action@v6
        with:
          context: backend/core-platform
          push: false
          load: true
          tags: occpl/core-platform:${{ github.sha }}
      - name: Build product-sample image
        uses: docker/build-push-action@v6
        with:
          context: backend/product-sample
          push: false
          load: true
          tags: occpl/product-sample:${{ github.sha }}
      - name: Build admin-portal image
        uses: docker/build-push-action@v6
        with:
          context: frontend/admin-portal
          push: false
          load: true
          tags: occpl/admin-portal:${{ github.sha }}
      # Known vulnerabilities in the images (OS packages and bundled libraries). Fails on HIGH or
      # CRITICAL findings that have a fix; Trivy is built from a pinned release.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Install Trivy
        run: go install github.com/aquasecurity/trivy/cmd/trivy@v0.74.0
      - name: Scan images
        run: |
          for image in core-platform product-sample admin-portal; do
            "$(go env GOPATH)/bin/trivy" image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
              --exit-code 1 "occpl/$image:${{ github.sha }}"
          done

  infra:
    name: Infrastructure (Terraform, deploy bundle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
      - run: terraform fmt -check -recursive infra/aws
      - name: terraform validate
        run: |
          for stack in bootstrap shared envs/staging envs/production; do
            terraform -chdir="infra/aws/$stack" init -backend=false -input=false >/dev/null
            terraform -chdir="infra/aws/$stack" validate
          done
      - name: Production realm is in sync with the development realm
        run: python3 infra/aws/compose/keycloak/make-production-realm.py --check
      - name: Shell scripts
        run: |
          for f in infra/aws/scripts/*.sh infra/aws/compose/bin/*.sh; do bash -n "$f"; done
          shellcheck infra/aws/scripts/*.sh infra/aws/compose/bin/*.sh
      - name: Deploy compose file
        run: |
          REGISTRY=r RELEASE=x OCCPL_ENV=ci AWS_REGION=ap-south-1 \
            docker compose -f infra/aws/compose/docker-compose.yml config --quiet --no-env-resolution

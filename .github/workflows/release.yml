name: Release

# Continuous delivery to the production VPS (ADR-0012, D-16): after CI passed on main, publish the
# images to GitHub's container registry tagged with the commit SHA; then, after a manual approval on
# the "production" GitHub environment, copy the compose bundle to the server, start the release
# (bin/deploy.sh, with automatic rollback) and smoke-test it through the public address.
#
# Run it by hand to redeploy or roll back to a release whose images already exist: Actions →
# Release → Run workflow, with the full SHA of that commit.
#
# "production" environment (Settings → Environments): required reviewers, deployment branch main.
#   Variables: VPS_HOST (server address, e.g. 203.0.113.5)
#   Secrets:   VPS_SSH_KEY (private key of the deploy key authorised for user "occpl"),
#              VPS_KNOWN_HOSTS (output of `ssh-keyscan -t ed25519 <VPS_HOST>`)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Full git SHA to deploy (its images must already be in the registry)
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: release # one rollout at a time; never cancel one half-way
  cancel-in-progress: false

jobs:
  build:
    name: Publish images
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: meta
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "release=$SHA" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/occpl" >> "$GITHUB_OUTPUT"
      - name: Production realm is in sync with the development realm
        run: python3 infra/aws/compose/keycloak/make-production-realm.py --check
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: core-platform
        uses: docker/build-push-action@v6
        with:
          context: backend/core-platform
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.prefix }}-core-platform:${{ steps.meta.outputs.release }}
      - name: admin-portal
        uses: docker/build-push-action@v6
        with:
          context: frontend/admin-portal
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.prefix }}-admin-portal:${{ steps.meta.outputs.release }}
      - name: keycloak
        uses: docker/build-push-action@v6
        with:
          context: infra/aws/compose/keycloak
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.prefix }}-keycloak:${{ steps.meta.outputs.release }}

  deploy:
    name: Deploy to production
    needs: build
    # After a successful build, or a manual redeploy/rollback (build skipped). Either way the
    # "production" environment's required reviewers must approve before this job starts.
    if: always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.build.result == 'skipped'))
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.release }}
      - name: SSH access
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy the compose bundle
        env:
          HOST: ${{ vars.VPS_HOST }}
        run: |
          ssh_cmd="ssh -i $HOME/.ssh/id_deploy"
          rsync -az -e "$ssh_cmd" --exclude '.env' --exclude '.env.example' infra/vps/ "occpl@$HOST:/opt/occpl/"
          rsync -az -e "$ssh_cmd" infra/backup/ "occpl@$HOST:/opt/occpl/backup/"
      - name: Deploy
        env:
          HOST: ${{ vars.VPS_HOST }}
          RELEASE: ${{ needs.build.outputs.release || inputs.release }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          [[ "$RELEASE" =~ ^[0-9a-f]{40}$ ]] || { echo "release must be a full git SHA: $RELEASE"; exit 1; }
          # The job's token lets the server pull the private images for this deployment.
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/id_deploy "occpl@$HOST" \
            "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin >/dev/null"
          ssh -i ~/.ssh/id_deploy "occpl@$HOST" "chmod +x /opt/occpl/bin/*.sh /opt/occpl/backup/*.sh && /opt/occpl/bin/deploy.sh $RELEASE"
      - name: Smoke test
        run: infra/scripts/smoke-test.sh

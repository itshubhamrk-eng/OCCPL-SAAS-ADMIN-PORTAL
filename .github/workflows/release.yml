name: Release

# Continuous delivery (ADR-0012, D-16/D-17): after CI passed on main, publish the images to GitHub's
# container registry tagged with the commit SHA, deploy them to the development server (GitHub
# environment "dev", EC2) and smoke-test, then — once DEPLOY_PRODUCTION is "true" — to the production
# VPS (environment "production", after the reviewers' approval). Each deploy copies the compose
# bundle over SSH, runs bin/deploy.sh (automatic rollback) and smoke-tests the public addresses.
#
# Only what changed is rebuilt: infra/scripts/changed-paths.sh compares the commit with the one before it
# on main. An image whose sources did not change is re-tagged from the previous release (seconds, same
# digest, so the server leaves that container running); if that earlier image is missing it is built.
#
# Run it by hand to redeploy or roll back one target to a release whose images already exist:
# Actions → Release → Run workflow (full SHA + target).
#
# Each environment (Settings → Environments) has the same names:
#   Variables: VPS_HOST (server address), HOST_SUFFIX ("dev." for dev, empty for production)
#   Secrets:   VPS_SSH_KEY (private key authorised for user "occpl"),
#              VPS_KNOWN_HOSTS (output of `ssh-keyscan -t ed25519 <VPS_HOST>`)
#   "production" additionally: required reviewers, deployment branch main.
# Repository variable DEPLOY_PRODUCTION = true switches the production step on (leave it unset until
# the production server exists).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Full git SHA to deploy (its images must already be in the registry)
        required: true
      target:
        description: Where to deploy it
        type: choice
        options: [dev, production]
        default: dev

permissions:
  contents: read
  packages: write

concurrency:
  group: release # one rollout at a time; never cancel one half-way
  cancel-in-progress: false

jobs:
  build:
    name: Publish images
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2 # the commit and its parent, to see what changed
      - id: meta
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "release=$SHA" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/occpl" >> "$GITHUB_OUTPUT"
          echo "previous=$(git rev-parse --verify -q HEAD^1 || true)" >> "$GITHUB_OUTPUT"
      - name: What changed since the previous commit
        id: changes
        run: infra/scripts/changed-paths.sh "${{ steps.meta.outputs.previous }}" HEAD | tee -a "$GITHUB_OUTPUT"
      - name: Production realm is in sync with the development realm
        run: python3 infra/aws/compose/keycloak/make-production-realm.py --check
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: core-platform (reuse the previous image when unchanged)
        id: reuse_core_platform
        if: steps.changes.outputs.core != 'true'
        env:
          REPOSITORY: ${{ github.repository_owner }}/occpl-core-platform
          RELEASE: ${{ steps.meta.outputs.release }}
          PREVIOUS: ${{ steps.meta.outputs.previous }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Same manifest under the new tag (digest unchanged), so the server leaves the container alone.
          repo=$(echo "$REPOSITORY" | tr 'A-Z' 'a-z')
          status=0
          if [ -n "$PREVIOUS" ]; then
            infra/scripts/retag-image.sh ghcr.io "$repo" "$PREVIOUS" "$RELEASE" || status=$?
          else
            status=2
          fi
          if [ "$status" = 0 ]; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "core-platform: unchanged, re-tagged from $PREVIOUS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
            echo "core-platform: no earlier image to reuse (status $status), building" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: core-platform (build)
        if: steps.changes.outputs.core == 'true' || steps.reuse_core_platform.outputs.reused != 'true'
        uses: docker/build-push-action@v7
        with:
          context: backend/core-platform
          push: true
          provenance: false
          cache-from: type=gha,scope=core-platform
          cache-to: type=gha,mode=max,scope=core-platform
          tags: ${{ steps.meta.outputs.prefix }}-core-platform:${{ steps.meta.outputs.release }}
      - name: admin-portal (reuse the previous image when unchanged)
        id: reuse_admin_portal
        if: steps.changes.outputs.portal != 'true'
        env:
          REPOSITORY: ${{ github.repository_owner }}/occpl-admin-portal
          RELEASE: ${{ steps.meta.outputs.release }}
          PREVIOUS: ${{ steps.meta.outputs.previous }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Same manifest under the new tag (digest unchanged), so the server leaves the container alone.
          repo=$(echo "$REPOSITORY" | tr 'A-Z' 'a-z')
          status=0
          if [ -n "$PREVIOUS" ]; then
            infra/scripts/retag-image.sh ghcr.io "$repo" "$PREVIOUS" "$RELEASE" || status=$?
          else
            status=2
          fi
          if [ "$status" = 0 ]; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "admin-portal: unchanged, re-tagged from $PREVIOUS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
            echo "admin-portal: no earlier image to reuse (status $status), building" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: admin-portal (build)
        if: steps.changes.outputs.portal == 'true' || steps.reuse_admin_portal.outputs.reused != 'true'
        uses: docker/build-push-action@v7
        with:
          context: frontend/admin-portal
          push: true
          provenance: false
          cache-from: type=gha,scope=admin-portal
          cache-to: type=gha,mode=max,scope=admin-portal
          tags: ${{ steps.meta.outputs.prefix }}-admin-portal:${{ steps.meta.outputs.release }}
      - name: keycloak (reuse the previous image when unchanged)
        id: reuse_keycloak
        if: steps.changes.outputs.keycloak != 'true'
        env:
          REPOSITORY: ${{ github.repository_owner }}/occpl-keycloak
          RELEASE: ${{ steps.meta.outputs.release }}
          PREVIOUS: ${{ steps.meta.outputs.previous }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Same manifest under the new tag (digest unchanged), so the server leaves the container alone.
          repo=$(echo "$REPOSITORY" | tr 'A-Z' 'a-z')
          status=0
          if [ -n "$PREVIOUS" ]; then
            infra/scripts/retag-image.sh ghcr.io "$repo" "$PREVIOUS" "$RELEASE" || status=$?
          else
            status=2
          fi
          if [ "$status" = 0 ]; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "keycloak: unchanged, re-tagged from $PREVIOUS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
            echo "keycloak: no earlier image to reuse (status $status), building" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: keycloak (build)
        if: steps.changes.outputs.keycloak == 'true' || steps.reuse_keycloak.outputs.reused != 'true'
        uses: docker/build-push-action@v7
        with:
          context: infra/aws/compose/keycloak
          push: true
          provenance: false
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak
          tags: ${{ steps.meta.outputs.prefix }}-keycloak:${{ steps.meta.outputs.release }}

  plan:
    name: Plan the rollout
    needs: build
    # After a successful build, or a manual redeploy/rollback (build skipped).
    if: always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.build.result == 'skipped'))
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.plan.outputs.release }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BUILT: ${{ needs.build.outputs.release }}
          INPUT_RELEASE: ${{ inputs.release }}
          INPUT_TARGET: ${{ inputs.target }}
          PRODUCTION: ${{ vars.DEPLOY_PRODUCTION }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            release=$INPUT_RELEASE; targets="[\"$INPUT_TARGET\"]"
          else
            release=$BUILT; targets='["dev"]'
            [ "$PRODUCTION" != true ] || targets='["dev","production"]'
          fi
          [[ "$release" =~ ^[0-9a-f]{40}$ ]] || { echo "release must be a full git SHA: $release"; exit 1; }
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: true # a failed dev deploy stops the production deploy
      max-parallel: 1 # dev first, then production
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ubuntu-24.04
    environment: ${{ matrix.target }} # "production" waits for its reviewers
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.release }}
      - name: SSH access
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy the compose bundle
        env:
          HOST: ${{ vars.VPS_HOST }}
        run: |
          ssh_cmd="ssh -i $HOME/.ssh/id_deploy"
          rsync -az -e "$ssh_cmd" --exclude '.env' --exclude '.env.example' infra/vps/ "occpl@$HOST:/opt/occpl/"
          rsync -az -e "$ssh_cmd" infra/backup/ "occpl@$HOST:/opt/occpl/backup/"
      - name: Deploy
        env:
          HOST: ${{ vars.VPS_HOST }}
          RELEASE: ${{ needs.plan.outputs.release }}
          # GHCR_PULL_TOKEN (optional secret): a classic personal access token with only read:packages, for private images
          # in other repositories (the courier-service and courier-web packages). Without it the job's token is used,
          # which can read only this repository's own packages.
          REGISTRY_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          # GHCR_PULL_USER (optional variable): the GitHub user the token belongs to; defaults to the repository owner.
          REGISTRY_USER: ${{ secrets.GHCR_PULL_TOKEN && (vars.GHCR_PULL_USER || github.repository_owner) || github.actor }}
        run: |
          # The token lets the server pull the private images for this deployment.
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/id_deploy "occpl@$HOST" \
            "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin >/dev/null"
          ssh -i ~/.ssh/id_deploy "occpl@$HOST" "chmod +x /opt/occpl/bin/*.sh /opt/occpl/backup/*.sh && /opt/occpl/bin/deploy.sh $RELEASE"
      - name: Smoke test
        env:
          HOST_SUFFIX: ${{ vars.HOST_SUFFIX }}
          # Set the variable to "true" on the dev environment only, if the Keycloak admin console is opened to all addresses.
          ALLOW_PUBLIC_ADMIN_CONSOLE: ${{ vars.ALLOW_PUBLIC_ADMIN_CONSOLE }}
        run: infra/scripts/smoke-test.sh "$HOST_SUFFIX"

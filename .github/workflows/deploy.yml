name: Deploy

# Continuous delivery to AWS (ADR-0011, D-15): after CI passes on main, publish the images to ECR
# tagged with the commit SHA and — after a manual approval on the "production" GitHub environment —
# roll them out to production and smoke-test. There is no AWS staging environment: releases are
# verified by CI and on the local Docker Compose stack (DEPLOYMENT.md §1). Run manually to redeploy or
# roll back a release that is already in ECR (infra/aws/RUNBOOK.md §2).
#
# Repository variables: AWS_BUILD_ROLE_ARN, ECR_REGISTRY, ARTIFACTS_BUCKET.
# "production" environment variables: AWS_DEPLOY_ROLE_ARN, ASG_NAME, TARGET_GROUP_ARNS.
# Values: `terraform output` of infra/aws/shared and infra/aws/envs/production.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Release to deploy (full git SHA of images already in ECR)
        required: true

permissions:
  contents: read
  id-token: write # OIDC → AWS, no stored keys

concurrency:
  group: deploy # one rollout at a time; never cancel one half-way
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  build:
    name: Publish images
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: release
        run: echo "release=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
      - name: Production realm is in sync with the development realm
        run: python3 infra/aws/compose/keycloak/make-production-realm.py --check
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: core-platform
        uses: docker/build-push-action@v6
        with:
          context: backend/core-platform
          push: true
          provenance: false
          tags: ${{ vars.ECR_REGISTRY }}/occpl/core-platform:${{ steps.release.outputs.release }}
      - name: admin-portal
        uses: docker/build-push-action@v6
        with:
          context: frontend/admin-portal
          push: true
          provenance: false
          tags: ${{ vars.ECR_REGISTRY }}/occpl/admin-portal:${{ steps.release.outputs.release }}
      - name: keycloak
        uses: docker/build-push-action@v6
        with:
          context: infra/aws/compose/keycloak
          push: true
          provenance: false
          tags: ${{ vars.ECR_REGISTRY }}/occpl/keycloak:${{ steps.release.outputs.release }}

  production:
    name: Deploy to production
    needs: build
    # After a successful build, or a manual redeploy/rollback (build skipped). Either way the
    # "production" environment's required reviewers must approve before this job starts.
    if: >-
      always() &&
      (needs.build.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.build.result == 'skipped'))
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.release }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Rolling deploy
        env:
          OCCPL_ENV: production
          ASG_NAME: ${{ vars.ASG_NAME }}
          TARGET_GROUP_ARNS: ${{ vars.TARGET_GROUP_ARNS }}
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          RELEASE: ${{ needs.build.outputs.release || inputs.release }}
        run: |
          [[ "$RELEASE" =~ ^[0-9a-f]{40}$ ]] || { echo "release must be a full git SHA: $RELEASE"; exit 1; }
          infra/aws/scripts/rolling-deploy.sh "$RELEASE"
      - name: Smoke test
        run: infra/aws/scripts/smoke-test.sh

# Local development against infra/docker/docker-compose.yml. Never use these values elsewhere.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/occpl_core}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/occpl}

logging:
  structured:
    format:
      console: ""
  pattern:
    level: "%5p [%X{correlationId:-}]"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

occpl:
  openapi:
    oidc-issuer: ${OPENAPI_OIDC_ISSUER:http://localhost:8180/realms/occpl}
  identity:
    keycloak:
      base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
  rate-limit:
    redis-url: ${REDIS_URL:redis://localhost:6379}
  security:
    cors:
      allowed-origins: http://localhost:4200

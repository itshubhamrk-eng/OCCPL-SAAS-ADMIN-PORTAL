# Local development stack. Usage (from this directory):
#   cp .env.example .env   # then edit passwords
#   docker compose up --build
# Portal: http://localhost:4200  API docs: http://localhost:8080/swagger-ui.html  Keycloak: http://localhost:8180
name: occpl

services:
  mysql:
    image: mysql:9.7
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: occpl_core
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/01-create-users.sh:/docker-entrypoint-initdb.d/01-create-users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.10
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Substituted into the realm import (client occpl-core-admin).
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?set in .env}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak/occpl-realm.json:/opt/keycloak/data/import/occpl-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  core-platform:
    build: ../../backend/core-platform
    image: occpl/core-platform:local
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/occpl_core
      DB_USERNAME: occpl_app
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_MIGRATOR_USERNAME: occpl_migrator
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      # Tokens are issued for the browser-facing URL; keys are fetched over the compose network.
      OIDC_ISSUER_URI: http://localhost:8180/realms/occpl
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/occpl/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      API_DOCS_ENABLED: "true"
      OPENAPI_OIDC_ISSUER: http://localhost:8180/realms/occpl
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      BOOTSTRAP_SUPER_ADMIN_EMAIL: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:-}
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"

  admin-portal:
    build: ../../frontend/admin-portal
    image: occpl/admin-portal:local
    depends_on:
      - core-platform
    environment:
      API_BASE_URL: http://localhost:8080/api/v1
      OIDC_ISSUER: http://localhost:8180/realms/occpl
      OIDC_CLIENT_ID: occpl-admin-portal
      CSP_CONNECT_SRC: http://localhost:8080 http://localhost:8180
    ports:
      - "127.0.0.1:4200:8080"

volumes:
  mysql-data:

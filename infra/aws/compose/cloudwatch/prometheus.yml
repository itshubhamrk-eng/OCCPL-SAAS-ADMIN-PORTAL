# Scraped by the CloudWatch agent on each instance (Core's actuator, management port).
global:
  scrape_interval: 60s
  scrape_timeout: 10s
scrape_configs:
  - job_name: core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:8081"]
        labels:
          Environment: OCCPL_ENV
